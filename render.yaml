services:
  - type: web
    name: family-teknik-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: family_teknik
      - key: DB_SSL
        value: "true"
      - key: AI_URL
        sync: false
      - key: AI_TIMEOUT_MS
        value: "120000"
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true

  - type: web
    name: family-teknik-ai
    runtime: python
    plan: free
    rootDir: AI
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: web
    name: family-teknik-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
